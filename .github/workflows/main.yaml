name: LINE Bot CI and CD

on: [push, pull_request, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run Check
        run: ./check.sh
      - name: Run Tests
        run: uv run pytest -v
        env:
          LINE_CHANNEL_ACCESS_TOKEN: "dummy_for_Authorization_header"
          LINE_CHANNEL_SECRET: "dummy_for_WebhookParser"

  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity連携に必須

    steps:
    - uses: actions/checkout@v5

    - id: 'auth'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
        service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

    - name: 'Check files to be uploaded'
      run: gcloud meta list-files-for-upload

    - id: 'deploy'
      uses: 'google-github-actions/deploy-appengine@v3'
      with:
        project_id: '${{ secrets.GCP_PROJECT_ID }}'

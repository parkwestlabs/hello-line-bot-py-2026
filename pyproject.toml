[project]
name = "hello-line-bot-py-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "line-bot-sdk>=3.23.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "S101",     # assert
    "S105",     # hardcoded-password-string
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = ["test_*"]
